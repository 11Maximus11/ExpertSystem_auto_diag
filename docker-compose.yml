services:
  aideal-auto:
    image: msgcg/aideal-auto:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aideal-auto
    ports:
      - "8000:8000"
    gpus: all
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: "2gb"
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DJANGO_DB_PATH=/app/db_data/db.sqlite3
      - GGML_VULKAN=1
      - LLAMA_VULKAN=1
      - VULKAN_DEVICE=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      - MAX_VRAM_MB=${MAX_VRAM_MB:-auto}
      - VRAM_HEADROOM_MB=${VRAM_HEADROOM_MB:-1280}
      - LLM_CTX_SIZE=${LLM_CTX_SIZE:-32768}
      - AIRLLM_CONTEXT_WINDOW=${AIRLLM_CONTEXT_WINDOW:-32768}
      - AIRLLM_MODEL_ID=${AIRLLM_MODEL_ID:-google/gemma-4-12B-it-qat-w4a16-ct}
      - AIRLLM_COMPRESSION=${AIRLLM_COMPRESSION:-4bit}
      - HF_HOME=/app/models/.hf_cache
      - HF_TOKEN=${HF_TOKEN:-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}
      - RAG_USE_NEURAL=${RAG_USE_NEURAL:-1}
      - RAG_DEVICE=${RAG_DEVICE:-cpu}
      - RAG_INCLUDE_EXTERNAL=${RAG_INCLUDE_EXTERNAL:-1}
      - AUTODIAG_PRELOAD_ON_STARTUP=1
    volumes:
      - ./models:/app/models
      - ./db_data:/app/db_data
      - ./kb_data.json:/app/kb_data.json:ro
      - ./VehicleDiagnosticSample.txt:/app/VehicleDiagnosticSample.txt:ro
      - ./data:/app/data:ro
    restart: unless-stopped
