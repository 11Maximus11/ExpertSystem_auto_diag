services:
  autodiag-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodiag-pro-ai
    ports:
      - "8000:8000"
      - "8010:8010"
    environment:
      - DJANGO_DEBUG=1
      - GGML_VULKAN=1
      - LLAMA_VULKAN=1
      - VULKAN_DEVICE=0
      - MAX_VRAM_MB=8192
      - VULKAN_GPU_LAYERS=-1
      - LLM_CTX_SIZE=4096
      - AIRLLM_MODEL_ID=models/Qwen3.5-4B
      - AIRLLM_COMPRESSION=none
    volumes:
      - ./models:/app/models
      - ./media:/app/media
      - ./kb_data.json:/app/kb_data.json:ro
      - ./VehicleDiagnosticSample.txt:/app/VehicleDiagnosticSample.txt:ro
    # На Linux хостах раскомментируйте секцию devices/deploy для прямого проброса GPU:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
